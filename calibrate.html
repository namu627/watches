<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시계 보정 도구</title>
<style>
  :root{--ink:#1a1a1a;--muted:#8a8a8a;--line:#e6e6e6;--accent:#2a4b8d}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,'Inter',sans-serif;color:var(--ink);background:#fff;display:flex;min-height:100dvh}
  .left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  .stage{position:relative;width:min(70vw,520px);aspect-ratio:1/1;touch-action:none}
  .stage img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;will-change:transform}
  #body{z-index:1}#date{z-index:2}#hour{z-index:3}#minute{z-index:4}#second{z-index:5}
  .date-window{position:absolute;transform:translate(-50%,-50%);z-index:2;pointer-events:none;line-height:1;font-variant-numeric:lining-nums tabular-nums}
  /* 얇은 십자선 (활성 대상 축/창) */
  #cross{position:absolute;width:0;height:0;z-index:9;cursor:grab;color:#e5322b}
  #cross.drag{cursor:grabbing}
  #cross::before,#cross::after{content:"";position:absolute;background:currentColor;opacity:.95}
  #cross::before{width:60px;height:1px;left:-30px;top:0}
  #cross::after{height:60px;width:1px;top:-30px;left:0}
  #cross .hit{position:absolute;left:-16px;top:-16px;width:32px;height:32px;border-radius:50%}
  .hint{color:var(--muted);font-size:13px;text-align:center;max-width:520px;line-height:1.5}
  .err{color:#c0392b;font-size:13px;max-width:460px;text-align:center}
  .panel{width:340px;max-width:92vw;border-left:1px solid var(--line);padding:18px 18px 40px;overflow:auto;font-size:13px}
  .panel h1{font-size:15px;margin:0 0 2px}
  .panel .sub{color:var(--muted);margin:0 0 14px}
  select{width:100%;padding:7px;border:1px solid var(--line);border-radius:7px;font:inherit;margin-bottom:8px}
  .grp{border-top:1px solid var(--line);padding:12px 0}
  .grp:last-of-type{border-bottom:1px solid var(--line)}
  .grp h3{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600}
  .pivsel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
  .pivsel button{padding:7px 4px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;cursor:pointer;font:inherit}
  .pivsel button.on{border-color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--hl)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
  .row label{color:#444}
  .row input[type=number]{width:110px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font:inherit;text-align:right}
  .row input[type=color]{width:44px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px}
  .row .px{color:var(--muted);font-size:11px;min-width:56px;text-align:right}
  .chk{display:flex;align-items:center;gap:8px;margin:6px 0}
  .btnrow{display:flex;gap:8px;margin-top:12px;align-items:center}
  button.act{padding:8px 12px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:7px;cursor:pointer;font:inherit}
  button.ghost{padding:8px 12px;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:7px;cursor:pointer;font:inherit}
  #copied{color:var(--accent);font-size:12px;opacity:0;transition:opacity .2s}
  textarea{width:100%;height:170px;margin-top:10px;border:1px solid var(--line);border-radius:7px;padding:8px;font:12px ui-monospace,monospace}
</style>
</head>
<body>
  <div class="left">
    <div class="stage" id="stage">
      <span id="cross"><span class="hit"></span></span>
    </div>
    <p class="hint">위에서 대상을 고르고, 그 축/창(십자)을 <b>드래그</b>하거나 <b>화살표키</b>로 이동<br>
       Shift=거칠게 · Alt=초미세 · 각 바늘은 자기 허브를 축으로 돕니다</p>
    <p class="err" id="err"></p>
  </div>

  <aside class="panel">
    <h1>시계 보정 도구</h1>
    <p class="sub">맞춘 뒤 <b>config 복사</b> → watches.js 항목에 붙여넣기.</p>
    <select id="pick"></select>

    <div class="grp">
      <h3>조절 대상</h3>
      <div class="pivsel" id="pivsel">
        <button data-p="hour"   style="--hl:#e5322b">시침</button>
        <button data-p="minute" style="--hl:#e59a00">분침</button>
        <button data-p="second" style="--hl:#2a6fe5">초침</button>
        <button data-p="date"   style="--hl:#12a150">date침</button>
        <button data-p="window" style="--hl:#8e44ad">날짜창</button>
      </div>
      <div class="row"><label id="lblx">축 x</label><input type="number" id="cx" step="0.0001"><span class="px" id="cxpx"></span></div>
      <div class="row"><label id="lbly">축 y</label><input type="number" id="cy" step="0.0001"><span class="px" id="cypx"></span></div>
    </div>

    <div class="grp" id="grpWin">
      <h3>날짜 창 스타일</h3>
      <div class="row"><label>글자 크기</label><input type="number" id="wsize" step="0.001"></div>
      <div class="row"><label>색</label><input type="color" id="wcolor"></div>
      <div class="chk"><input type="checkbox" id="wpad"><label for="wpad">한 자리도 0채움 (06)</label></div>
    </div>

    <div class="grp">
      <h3>기준 각도 (이미지가 현재 가리키는 각, °)</h3>
      <div class="row"><label>hour</label><input type="number" id="oaH" step="0.01"></div>
      <div class="row"><label>minute</label><input type="number" id="oaM" step="0.01"></div>
      <div class="row"><label>second</label><input type="number" id="oaS" step="0.01"></div>
      <div class="row" id="rowD"><label>date</label><input type="number" id="oaD" step="0.01"></div>
    </div>

    <div class="grp" id="grpDate">
      <h3>date 눈금</h3>
      <div class="row"><label>dateZero</label><input type="number" id="dz" step="0.01"></div>
      <div class="row"><label>dateStep</label><input type="number" id="ds" step="0.0001"></div>
    </div>

    <div class="grp">
      <h3>시간 고정 (정렬 확인)</h3>
      <div class="chk"><input type="checkbox" id="freeze"><label for="freeze">고정</label></div>
      <div class="row"><label>시</label><input type="number" id="fH" min="0" max="23" value="10"></div>
      <div class="row"><label>분</label><input type="number" id="fM" min="0" max="59" value="8"></div>
      <div class="row"><label>초</label><input type="number" id="fS" min="0" max="59" value="42"></div>
      <div class="row"><label>일</label><input type="number" id="fD" min="1" max="31" value="19"></div>
    </div>

    <div class="btnrow">
      <button class="act" id="copy">config 복사</button>
      <button class="ghost" id="reset">되돌리기</button>
      <span id="copied">복사됨</span>
    </div>
    <textarea id="out" readonly></textarea>
  </aside>

<script src="watches.js"></script>
<script>
const $=id=>document.getElementById(id);
const stage=$('stage'), cross=$('cross');
const HL={hour:'#e5322b',minute:'#e59a00',second:'#2a6fe5',date:'#12a150',window:'#8e44ad'};
let CFG, ORIG, active='hour', imgs={}, winEl=null;

function buildImages(){
  for(const k in imgs) imgs[k].remove(); imgs={};
  if(winEl){winEl.remove();winEl=null;}
  const Z={body:1,date:2,hour:3,minute:4,second:5};
  ['body','date','hour','minute','second'].forEach(k=>{
    if(k==='date' && !CFG.hasDate) return;
    const im=document.createElement('img');
    im.id=k; im.src=CFG.base.replace(/\/$/,'')+'/'+k+'.png'; im.alt=k; im.style.zIndex=Z[k];
    im.onerror=()=>{ $('err').textContent='이미지 로드 실패: '+im.src+'  (file:// 로 열면 안 됨 → 로컬 서버로 실행)'; };
    stage.insertBefore(im, cross); imgs[k]=im;
  });
  if(CFG.dateWindow){
    winEl=document.createElement('div'); winEl.className='date-window';
    stage.insertBefore(winEl, cross);
    applyWindow();
  }
}
function applyWindow(){
  if(!winEl) return; const w=CFG.dateWindow;
  winEl.style.left=(w.x*100)+'%'; winEl.style.top=(w.y*100)+'%';
  winEl.style.color=w.color||'#fff'; winEl.style.fontFamily=w.font||'Arial, Helvetica, sans-serif';
  winEl.style.textAlign=w.align||'center';
  winEl.style.fontSize=((w.size||0.04)*stage.clientWidth)+'px';
  const d=($('freeze').checked?+$('fD').value:new Date().getDate());
  winEl.textContent=w.pad?String(d).padStart(2,'0'):String(d);
}
function centerOf(hand){ return CFG.centers[hand]; }
function activeObj(){ return active==='window'?CFG.dateWindow:CFG.centers[active]; }
function applyOrigins(){
  ['hour','minute','second','date'].forEach(k=>{
    if(imgs[k]){ const c=centerOf(k); imgs[k].style.transformOrigin=(c.x*100)+'% '+(c.y*100)+'%'; }
  });
  applyWindow();
  const c=activeObj();
  cross.style.left=(c.x*100)+'%'; cross.style.top=(c.y*100)+'%'; cross.style.color=HL[active];
}
function now(){
  if($('freeze').checked) return {h:+$('fH').value,m:+$('fM').value,s:+$('fS').value,ms:0,day:+$('fD').value};
  const t=new Date(); return {h:t.getHours(),m:t.getMinutes(),s:t.getSeconds(),ms:t.getMilliseconds(),day:t.getDate()};
}
function frame(){
  const t=now(), sec=t.s+t.ms/1000, O=CFG.originAngle;
  const secA=sec*6, minA=(t.m+sec/60)*6, hrA=((t.h%12)+t.m/60+sec/3600)*30;
  if(imgs.hour)   imgs.hour.style.transform  ='rotate('+(hrA -O.hour )+'deg)';
  if(imgs.minute) imgs.minute.style.transform='rotate('+(minA-O.minute)+'deg)';
  if(imgs.second) imgs.second.style.transform='rotate('+(secA-O.second)+'deg)';
  if(imgs.date){ const dA=(CFG.dateZero||0)+(t.day-1)*(CFG.dateStep||360/31);
    imgs.date.style.transform='rotate('+(dA-O.date)+'deg)'; }
  if(winEl) applyWindow();
  requestAnimationFrame(frame);
}

function refreshCenterInputs(){
  const c=activeObj(), isWin=active==='window';
  $('lblx').textContent=isWin?'창 x':'축 x'; $('lbly').textContent=isWin?'창 y':'축 y';
  $('cx').value=c.x.toFixed(4); $('cy').value=c.y.toFixed(4);
  $('cxpx').textContent=(c.x*2048).toFixed(2)+'px'; $('cypx').textContent=(c.y*2048).toFixed(2)+'px';
}
function refreshAngles(){
  const O=CFG.originAngle, has=CFG.hasDate;
  $('oaH').value=O.hour; $('oaM').value=O.minute; $('oaS').value=O.second;
  $('rowD').style.display=$('grpDate').style.display=has?'':'none';
  document.querySelector('.pivsel button[data-p=date]').style.display=has?'':'none';
  if(has){ $('oaD').value=O.date; $('dz').value=CFG.dateZero||0; $('ds').value=CFG.dateStep||360/31; }
}
function refreshWindowUI(){
  const hasW=!!CFG.dateWindow;
  $('grpWin').style.display=hasW?'':'none';
  document.querySelector('.pivsel button[data-p=window]').style.display=hasW?'':'none';
  if(hasW){ const w=CFG.dateWindow; $('wsize').value=w.size; $('wcolor').value=(w.color||'#ffffff'); $('wpad').checked=!!w.pad; }
}
function setActive(p){
  if(p==='date' && !CFG.hasDate) p='hour';
  if(p==='window' && !CFG.dateWindow) p='hour';
  active=p;
  document.querySelectorAll('.pivsel button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  applyOrigins(); refreshCenterInputs();
}
function normCenters(cfg){
  if(cfg.centers) return structuredClone(cfg.centers);
  const d=cfg.dialCenter||{x:.5,y:.5}, s=cfg.subCenter||{x:.5,y:.5};
  return {hour:{...d},minute:{...d},second:{...d},date:{...s}};
}
function load(cfg){
  CFG=structuredClone(cfg);
  CFG.centers=normCenters(cfg);
  if(!CFG.originAngle.date) CFG.originAngle.date=0;
  $('err').textContent='';
  buildImages(); refreshAngles(); refreshWindowUI(); setActive('hour'); dumpOut();
}

WATCHES.forEach((w,i)=>{const o=document.createElement('option');o.value=i;o.textContent=w.name;$('pick').appendChild(o);});
$('pick').addEventListener('change',e=>{ORIG=WATCHES[+e.target.value];load(ORIG);});
document.querySelectorAll('.pivsel button').forEach(b=>b.addEventListener('click',()=>setActive(b.dataset.p)));
$('cx').addEventListener('input',e=>{activeObj().x=parseFloat(e.target.value)||0;applyOrigins();refreshCenterInputs();dumpOut();});
$('cy').addEventListener('input',e=>{activeObj().y=parseFloat(e.target.value)||0;applyOrigins();refreshCenterInputs();dumpOut();});
$('wsize').addEventListener('input',e=>{CFG.dateWindow.size=parseFloat(e.target.value)||0;applyWindow();dumpOut();});
$('wcolor').addEventListener('input',e=>{CFG.dateWindow.color=e.target.value;applyWindow();dumpOut();});
$('wpad').addEventListener('input',e=>{CFG.dateWindow.pad=e.target.checked;applyWindow();dumpOut();});
[['oaH','hour'],['oaM','minute'],['oaS','second'],['oaD','date']].forEach(([id,k])=>
  $(id).addEventListener('input',e=>{CFG.originAngle[k]=parseFloat(e.target.value)||0;dumpOut();}));
$('dz').addEventListener('input',e=>{CFG.dateZero=parseFloat(e.target.value)||0;dumpOut();});
$('ds').addEventListener('input',e=>{CFG.dateStep=parseFloat(e.target.value)||0;dumpOut();});

let dragging=false;
cross.addEventListener('pointerdown',e=>{dragging=true;cross.classList.add('drag');cross.setPointerCapture(e.pointerId);e.preventDefault();});
addEventListener('pointermove',e=>{
  if(!dragging)return; const r=stage.getBoundingClientRect();
  const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  const y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  const c=activeObj(); c.x=x; c.y=y; applyOrigins(); refreshCenterInputs(); dumpOut();
});
addEventListener('pointerup',()=>{if(dragging){cross.classList.remove('drag');dragging=false;}});

addEventListener('keydown',e=>{
  if(document.activeElement.tagName==='INPUT')return;
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;
  e.preventDefault();
  const step=e.shiftKey?0.002:e.altKey?0.0001:0.0005, c=activeObj();
  if(e.key==='ArrowLeft')c.x-=step; if(e.key==='ArrowRight')c.x+=step;
  if(e.key==='ArrowUp')c.y-=step; if(e.key==='ArrowDown')c.y+=step;
  applyOrigins(); refreshCenterInputs(); dumpOut();
});

function r4(v){return +v.toFixed(4);}
function dumpOut(){
  const c={id:CFG.id,name:CFG.name,base:CFG.base,hasDate:CFG.hasDate,
    centers:{
      hour:{x:r4(CFG.centers.hour.x),y:r4(CFG.centers.hour.y)},
      minute:{x:r4(CFG.centers.minute.x),y:r4(CFG.centers.minute.y)},
      second:{x:r4(CFG.centers.second.x),y:r4(CFG.centers.second.y)}
    },
    originAngle:{hour:CFG.originAngle.hour,minute:CFG.originAngle.minute,second:CFG.originAngle.second}};
  if(CFG.hasDate){ c.centers.date={x:r4(CFG.centers.date.x),y:r4(CFG.centers.date.y)};
    c.originAngle.date=CFG.originAngle.date; c.dateZero=CFG.dateZero||0; c.dateStep=CFG.dateStep||360/31; }
  if(CFG.dateWindow){ const w=CFG.dateWindow;
    c.dateWindow={x:r4(w.x),y:r4(w.y),size:w.size,color:w.color,font:w.font,pad:!!w.pad,align:w.align||'center'}; }
  $('out').value=JSON.stringify(c,null,2);
}
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('out').value);}catch(e){}
  $('copied').style.opacity=1;setTimeout(()=>$('copied').style.opacity=0,1200);});
$('reset').addEventListener('click',()=>load(ORIG));

ORIG=WATCHES[0]; load(ORIG); requestAnimationFrame(frame);
</script>
</body>
</html>
